version: '3.8'

services:
  # ==========================================
  # 1. MetaTrader 5 Container
  # ==========================================
  # metatrader5:
  #   image: gmag11/metatrader5_vnc:latest
  #   container_name: mt5_server
  #   restart: unless-stopped
  #   ports:
  #     - "3002:3000"   # noVNC Web Interface
  #     - "8002:8001"   # MT5 API / WebSocket Port
  #   environment:
  #     - CUSTOM_USER=admin
  #     - PASSWORD=YourSecurePassword123
  #   volumes:
  #     - mt5_data:/config
  #     - ./custom-init/00-fix-mt5linux.sh:/custom-cont-init.d/00-fix-mt5linux.sh

  # ==========================================
  # 2. SmartFlowAlgo Next.js Frontend
  # ==========================================
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartflowalgo-frontend
    restart: unless-stopped
    ports:
      - "${PORT:-9086}:9086"
    env_file:
      - .env
    environment:
      - PORT=9086
      - NODE_OPTIONS=--no-network-family-autoselection
      # The chart connects to this endpoint from inside the frontend container.
      # Set it to the address of the existing MT5 service reachable on this host/network.
      - MT5_WS_URL=${MT5_WS_URL:-ws://host.docker.internal:8001}
      - MT5_API_KEY=${MT5_API_KEY:-demo_key}

volumes:
  mt5_data:
